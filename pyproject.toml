[project]
name = "littledevil-recorder"
version = "0.1.0"
description = "Data Floor: trade/depth ingestion, Universe Refresh, Event Gates, Data Health."
requires-python = ">=3.12"
dependencies = [
    "littledevil-shared @ git+https://github.com/Liittledevil-x/littledevil-shared.git@v0.1.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
littledevil-recorder = "littledevil_recorder.main:main"
littledevil-backfill = "littledevil_recorder.backfill_job:main"
littledevil-historical-corpus = "littledevil_recorder.historical_corpus:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/littledevil_recorder"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
